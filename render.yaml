services:
  - type: web
    name: tokioinbox-multicardapio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
        # @supabase/supabase-js (biblioteca do backend) exige Node 22+ —
        # sem isso o servidor NEM INICIA no Render, mesmo sem usar canais
        # realtime do Supabase (o pacote realtime-js exige WebSocket nativo
        # do Node assim que é importado, e isso só existe a partir do Node
        # 22). Bug real corrigido aqui: uma rodada anterior tinha fixado
        # NODE_VERSION=20.11.0, o que derrubava o processo logo no boot com
        # "Error: Node.js detected but native WebSocket not found." Mantenha
        # esse valor em Node 22.x — nunca volte pra Node 20 enquanto o
        # projeto usar @supabase/supabase-js.
      - key: ADMIN_PASSWORD
        sync: false
        # ⚠️ Defina o valor real dessa senha direto no painel do Render
        # (Environment). É a senha do ADMIN MASTER — dá acesso total ao
        # painel em /PAINELRESTAURANTE (endereço oficial; /admin continua
        # aceito por compatibilidade com links antigos), incluindo todos os
        # restaurantes cadastrados (a quantidade é dinâmica, não fixa).
      - key: SUPABASE_URL
        sync: false
        # Fase 2 — ver docs/SUPABASE_SETUP.md. Se deixar em branco, o
        # servidor volta a usar server/data/ (arquivos JSON) automaticamente.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        # A chave "service_role" do seu projeto Supabase (Dashboard → Project
        # Settings → API). NUNCA a chave "anon". Ver docs/SUPABASE_SETUP.md.
        # Defina só aqui no painel do Render — nunca no repositório.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
        # Fase 4 — ver server/lib/cloudinary.js. As 3 variáveis CLOUDINARY_*
        # vêm do Dashboard do Cloudinary (cloudinary.com → Dashboard). Sem
        # elas, o upload de fotos volta a usar o disco local (efêmero no
        # Render — ver aviso abaixo).
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
        # Nunca comitar o valor real. Usada só pelo backend, nunca enviada
        # ao frontend.
    autoDeploy: true
    # ATENÇÃO (resolvido pela Fase 2, se SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY
    # estiverem configurados): o plano free do Render tem disco efêmero —
    # server/data/ volta ao estado do último deploy sempre que o serviço
    # reinicia. Sem Supabase configurado, cardápios editados e pedidos
    # recebidos se perdem a cada reinício/redeploy. Com Supabase configurado,
    # pedidos/cardápio/config passam a viver no Postgres do Supabase, e o
    # disco efêmero deixa de ser um problema para ESSES dados.
    #
    # Fase 4 (resolvido, se CLOUDINARY_CLOUD_NAME/API_KEY/API_SECRET estiverem
    # configurados): imagens enviadas pelo admin (logo, banner, splash, fotos
    # de prato, entregadores) agora sobem pro Cloudinary e ficam com URL
    # https permanente — deixam de depender do disco efêmero do Render. Sem
    # essas 3 variáveis, o upload volta a cair no disco local de
    # server/data/uploads/ (mesmo comportamento de antes, ainda efêmero).
