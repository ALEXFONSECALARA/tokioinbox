<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".42"/></filter>
  <linearGradient id="cardUse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c3f74"/>
    <stop offset="1" stop-color="#0a1830"/>
  </linearGradient>
  <radialGradient id="tableTopUse" cx="35%" cy="28%" r="80%">
    <stop offset="0" stop-color="#fffaf0"/>
    <stop offset=".55" stop-color="#f0e6cf"/>
    <stop offset="1" stop-color="#cdb789"/>
  </radialGradient>
  <radialGradient id="chairUse" cx="35%" cy="25%" r="80%">
    <stop offset="0" stop-color="#8a2f3d"/>
    <stop offset="1" stop-color="#5c1620"/>
  </radialGradient>
</defs>

<rect x="10" y="10" width="220" height="150" rx="28" fill="url(#cardUse)" stroke="#d4af37" stroke-width="3"/>
<ellipse cx="120" cy="150" rx="88" ry="7" fill="#000" opacity=".3"/>

<g filter="url(#s)">
  <!-- top chair + person -->
  <g><ellipse cx="120" cy="40" rx="20" ry="13" fill="url(#chairUse)" stroke="#d4af37" stroke-width="2"/>
     <path d="M100 34 q20 -15 40 0" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
     <path d="M105 40 q15 -14 30 0 q0 8 -15 8 q-15 0 -15 -8z" fill="#3b5a8a"/>
     <circle cx="120" cy="26" r="7.5" fill="#e0ab7c"/></g>
  <!-- bottom chair + person -->
  <g><ellipse cx="120" cy="140" rx="20" ry="13" fill="url(#chairUse)" stroke="#d4af37" stroke-width="2"/>
     <path d="M100 146 q20 15 40 0" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
     <path d="M105 140 q15 14 30 0 q0 -8 -15 -8 q-15 0 -15 8z" fill="#8a6a3b"/>
     <circle cx="120" cy="154" r="7.5" fill="#c98a56"/></g>
  <!-- left chair + person -->
  <g><ellipse cx="42" cy="90" rx="13" ry="20" fill="url(#chairUse)" stroke="#d4af37" stroke-width="2"/>
     <path d="M36 70 q-15 20 0 40" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
     <path d="M42 75 q14 15 0 30 q-8 0 -8 -15 q0 -15 8 -15z" fill="#3b7a5a"/>
     <circle cx="28" cy="90" r="7.5" fill="#e0ab7c"/></g>
  <!-- right chair (empty seat, e.g. 3 of 4 lugares ocupados) -->
  <g><ellipse cx="198" cy="90" rx="13" ry="20" fill="url(#chairUse)" stroke="#d4af37" stroke-width="2"/>
     <path d="M204 70 q15 20 0 40" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/></g>

  <ellipse cx="120" cy="90" rx="58" ry="40" fill="url(#tableTopUse)" stroke="#d4af37" stroke-width="3"/>
  <ellipse cx="120" cy="90" rx="46" ry="30" fill="none" stroke="#e6d8ae" stroke-width="1.5"/>
  <!-- pratos -->
  <circle cx="120" cy="72" r="7" fill="#fff" stroke="#cbb98a" stroke-width="1"/>
  <circle cx="120" cy="108" r="7" fill="#fff" stroke="#cbb98a" stroke-width="1"/>
  <circle cx="90" cy="90" r="7" fill="#fff" stroke="#cbb98a" stroke-width="1"/>
</g>

<circle cx="34" cy="34" r="17" fill="#0a1830" stroke="#d4af37" stroke-width="2.5"/>
<text x="34" y="39.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#d4af37" text-anchor="middle">07</text>

<text x="120" y="164" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="1.5">OCUPADA</text>
</svg>
